version: "3.8"

services:
  snu-toto:
    image: ${{ secrets.DOCKER_HUB_USERNAME }}/snu-toto:latest 
    container_name: snu-toto
    env_file:
      - .env.prod
    expose:
      - "8080"
    command: sh -c "uv run alembic upgrade head && uv run uvicorn snu_toto.main:app --host 0.0.0.0 --port 8080"
    restart: always
    networks:
      - my-network

  nginx:
    depends_on:
      - snu-toto
    container_name: nginx-container
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro 
      - /var/www/certbot:/var/www/certbot:ro
    networks:
      - my-network
    restart: always

  certbot:
    image: certbot/certbot
    container_name: snu-toto-certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot
    # 12시간마다 인증서 갱신 시도 (이건 뭐지?)
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  my-network: