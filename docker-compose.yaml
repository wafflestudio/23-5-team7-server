services:
  snu-toto:
    image: tacobro/snu-toto:latest 
    container_name: snu-toto
    env_file:
      - .env.prod
    environment:
      - ENV=prod
      - REDIS_URL=redis://redis:6379
    expose:
      - "8080"
    command: sh -c 'uv run alembic upgrade head && uv run uvicorn snu_toto.app.main:app --host 0.0.0.0 --port 8080'
    restart: always
    depends_on:
      - redis
    networks:
      - my-network
  
  redis:
    image: redis:latest
    container_name: redis-container
    expose:
      - "6379"
    volumes:
      - redis_data:/data  # 컨테이너가 새로 만들어져도 데이터가 지워지지 않음
    restart: always
    networks:
      - my-network

  nginx:
    depends_on:
      - snu-toto
    container_name: nginx-container
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro 
      - /var/www/certbot:/var/www/certbot:ro
    networks:
      - my-network
    restart: always

  certbot:
    image: certbot/certbot
    container_name: snu-toto-certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot
    # 12시간마다 인증서 갱신 시도
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  my-network: