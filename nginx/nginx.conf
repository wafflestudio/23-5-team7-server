events {
    worker_connections 1024;
}

http {
    upstream snu-toto-api {
        server snu-toto:8080; 
    }

    server {
        listen 80;
        server_name server.snutoto.o-r.kr;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name server.snutoto.o-r.kr; 

        ssl_certificate /etc/letsencrypt/live/server.snutoto.o-r.kr/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/server.snutoto.o-r.kr/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://snu-toto-api; 
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }
    }
}